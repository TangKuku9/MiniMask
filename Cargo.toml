[package]
name = "MiniMask"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A lightweight, stable and secure reverse-tunnel server with an embedded Web UI"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
yamux = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"

# tikv-jemallocator reduces fragmentation on long-running servers.
# Only enabled on non-MSVC unix targets to avoid Windows build issues.
[target.'cfg(all(unix, not(target_env = "msvc")))'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

